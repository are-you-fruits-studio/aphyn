[package]
name = "aphyn_asset_loading"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
aphyn_utils = { path = "../utils" }
aphyn_ecs = { path = "../ecs" }
aphyn_math = { path = "../math" }
aphyn_ffi = { path = "../ffi" }
aphyn_transform = { path = "../transform" }
aphyn_wavefront = { path = "../wavefront" }
aphyn_render_core = { path = "../render_core" }
aphyn_render = { path = "../render" }
aphyn_asset_storage = { path = "../asset_storage" }
aphyn_audio = { path = "../audio" }
aphyn_prefab = { path = "../prefab" }
aphyn_serialization = { path = "../serialization" }
aphyn_ui = { path = "../ui" }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hound = "3.5"