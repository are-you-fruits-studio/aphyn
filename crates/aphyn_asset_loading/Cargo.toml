[package]
name = "aphyn_asset_loading"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
aphyn_utils = { path = "../aphyn_utils" }
aphyn_ecs = { path = "../aphyn_ecs" }
aphyn_math = { path = "../aphyn_math" }
aphyn_ffi = { path = "../aphyn_ffi" }
aphyn_transform = { path = "../aphyn_transform" }
aphyn_wavefront = { path = "../aphyn_wavefront" }
aphyn_render_core = { path = "../aphyn_render_core" }
aphyn_render = { path = "../aphyn_render" }
aphyn_asset_storage = { path = "../aphyn_asset_storage" }
aphyn_audio = { path = "../aphyn_audio" }
aphyn_prefab = { path = "../aphyn_prefab" }
aphyn_serialization = { path = "../aphyn_serialization" }
aphyn_ui = { path = "../aphyn_ui" }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hound = "3.5"