[package]
name = "aphyn_prefab"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
aphyn_ecs = { path = "../ecs" }
aphyn_asset_storage = { path = "../asset_storage" }
aphyn_render_core = { path = "../render_core" }
aphyn_ui = { path = "../ui" }
aphyn_audio = { path = "../audio" }
aphyn_serialization = { path = "../serialization" }
aphyn_ffi = { path = "../ffi" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }