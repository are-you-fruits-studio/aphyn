[package]
name = "fruits_serialization"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib"]

[dependencies]
fruits_serialization_macros = { path = "../fruits_serialization_macros" }
fruits_ecs = { path = "../fruits_ecs" }
fruits_math = { path = "../fruits_math" }
fruits_ffi = { path = "../fruits_ffi" }
serde = { version = "1" }
serde_json = { version = "1", features = ["preserve_order"] }