[package]
name = "fruits_asset_loading"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
fruits_utils = { path = "../fruits_utils" }
fruits_ecs = { path = "../fruits_ecs" }
fruits_math = { path = "../fruits_math" }
fruits_ffi = { path = "../fruits_ffi" }
fruits_transform = { path = "../fruits_transform" }
fruits_wavefront = { path = "../fruits_wavefront" }
fruits_render_core = { path = "../fruits_render_core" }
fruits_render = { path = "../fruits_render" }
fruits_asset_storage = { path = "../fruits_asset_storage" }
fruits_audio = { path = "../fruits_audio" }
fruits_prefab = { path = "../fruits_prefab" }
fruits_serialization = { path = "../fruits_serialization" }
fruits_ui = { path = "../fruits_ui" }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hound = "3.5"