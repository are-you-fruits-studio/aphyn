name: Build Engine

# Publishes the version committed in Cargo.toml ([workspace.package] version) as
# release v<version>. Bump it first with `Prepare Release`; the description of
# the merged release PR becomes the release notes.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.VERSION_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: setver
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/workspace-version.sh get)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump the version with the Prepare Release workflow first."
            exit 1
          fi
          echo "Releasing v$version"
          echo "VERSION_TAG=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p aphyn_editor

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PKG="aphyn-${VERSION}-${{ matrix.target }}"
          OUT="dist/${PKG}"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/aphyn_editor" "$OUT/aphyn"
          tar -C "dist/$PKG" -czf "dist/${PKG}.tar.gz" aphyn 
          sha256sum "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "aphyn-$env:VERSION-${{ matrix.target }}"
          $out = "dist\$pkg"
          New-Item -ItemType Directory -Force -Path $out
          Copy-Item "target\${{ matrix.target }}\release\aphyn_editor.exe" "$out\aphyn.exe"
          Compress-Archive -Path "$out\*" -DestinationPath "dist\$pkg.zip"
          $hash = (Get-FileHash "dist\$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkg.zip" | Out-File -FilePath "dist\$pkg.zip.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Release notes from the release PR
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          body=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --head "release/v$VERSION" \
            --json body --jq '.[0].body // ""')
          if [[ -n "$body" ]]; then
            printf '%s\n' "$body" > "$RUNNER_TEMP/release-notes.md"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No merged PR from release/v$VERSION; falling back to generated release notes"
            : > "$RUNNER_TEMP/release-notes.md"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: engine v${{ needs.version.outputs.version }}
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            dist/**/**/*.tar.gz
            dist/**/**/*.tar.gz.sha256
            dist/**/**/*.zip
            dist/**/**/*.zip.sha256
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
