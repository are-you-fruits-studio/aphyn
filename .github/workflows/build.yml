name: Build Engine

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
          - random

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.VERSION_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: setver
        shell: bash
        run: |
          set -euo pipefail
          
          last_tag=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n1)
          if [[ -z "$last_tag" ]]; then last_tag="0.0.0"; fi
          
          last_tag="${last_tag#v}"
          last_tag="${last_tag//$'\r'/}"
          echo "Last tag: $last_tag"

          branch="${GITHUB_REF_NAME:-}"
          reltype="${{ github.event.inputs.bump_type }}"

          if [[ "$reltype" != "random" ]]; then
            IFS='.' read -r major minor patch <<< "$last_tag"
            case "$reltype" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              *)     patch=$((patch+1)) ;;
            esac
            new_tag="${major}.${minor}.${patch}"
          else
            postfix=$(LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c5 || true)
            [[ -z "$postfix" ]] && postfix=$((RANDOM % 10000))
            new_tag="${last_tag}-${postfix}"
          fi
          
          echo "New tag: $new_tag"
          echo "VERSION_TAG=$new_tag" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date +'%d.%m.%Y %H:%M')" >> $GITHUB_OUTPUT

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p fruits_editor

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PKG="fruits-engine-${VERSION}-${{ matrix.target }}"
          OUT="dist/${PKG}"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/fruits_editor" "$OUT/fruits_engine"
          tar -C "dist/$PKG" -czf "dist/${PKG}.tar.gz" fruits_engine 
          sha256sum "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "fruits-engine-$env:VERSION-${{ matrix.target }}"
          $out = "dist\$pkg"
          New-Item -ItemType Directory -Force -Path $out
          Copy-Item "target\${{ matrix.target }}\release\fruits_editor.exe" "$out\fruits_engine.exe"
          Compress-Archive -Path "$out\*" -DestinationPath "dist\$pkg.zip"
          $hash = (Get-FileHash "dist\$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkg.zip" | Out-File -FilePath "dist\$pkg.zip.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: engine v${{ needs.version.outputs.version }}
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            dist/**/**/*.tar.gz
            dist/**/**/*.tar.gz.sha256
            dist/**/**/*.zip
            dist/**/**/*.zip.sha256
          generate_release_notes: true
