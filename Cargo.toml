[workspace]
members = [
    "crates/alloc_monitor",
    "crates/audio",
    "crates/app",
    "crates/math",
    "crates/modules",
    "crates/utils",
    "crates/draft_check",
    "crates/ecs_macros",
    "crates/serialization",
    "crates/ecs",
    "crates/swizzling",
    "crates/reflection",
    "crates/reflection_macros",
    "crates/editor",
    "crates/ffi",
    "crates/math_macros",
    "crates/entry_point",
    "crates/app_launcher",
    "crates/asset_loading",
    "crates/asset_storage",
    "crates/wavefront",
    "crates/control_flow_macros",
    "crates/render",
    "crates/transform",
    "crates/collision",
    "crates/asset_storage",
    "crates/render_core",
    "crates/prefab",
    "crates/serialization_macros",
    "crates/audio",
    "crates/example/cubes",
    "crates/example/boids",
    "crates/example/ecs",
    "crates/example/gizmos",
    "crates/example/collisions",
    "crates/example/text",
    "crates/example/ui",
    "crates/example/audio_screen_saver",
    "crates/example/normals",
    "crates/example/bloom",
    "crates/ui",
    "crates/file_storage",
    "crates/window",
]

[workspace.package]
license = "MIT OR Apache-2.0"

[package]
name = "aphyn"
version = "0.7.1"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["lib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aphyn_app = { path = "./crates/app" }
aphyn_audio = { path = "./crates/audio" }
aphyn_ecs = { path = "./crates/ecs" }
aphyn_modules = { path = "./crates/modules" }
aphyn_utils = { path = "./crates/utils" }
aphyn_math = { path = "./crates/math" }
aphyn_math_macros = { path = "./crates/math_macros" }
aphyn_serialization = { path = "./crates/serialization" }
aphyn_reflection = { path = "./crates/reflection" }
aphyn_entry_point = { path = "./crates/entry_point" }
aphyn_app_launcher = { path = "./crates/app_launcher" }
aphyn_asset_loading = { path = "./crates/asset_loading" }
aphyn_asset_storage = { path = "./crates/asset_storage" }
aphyn_ffi = { path = "./crates/ffi" }
aphyn_control_flow_macros = { path = "./crates/control_flow_macros" }
aphyn_transform = { path = "./crates/transform" }
aphyn_render = { path = "./crates/render" }
aphyn_render_core = { path = "./crates/render_core" }
aphyn_collision = { path = "./crates/collision" }
aphyn_prefab = { path = "./crates/prefab" }
aphyn_ui = { path = "./crates/ui" }
aphyn_file_storage = { path = "./crates/file_storage" }
aphyn_window = { path = "./crates/window" }
